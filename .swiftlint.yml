# SwiftLint configuration. `make lint` runs this with --strict, so anything left
# enabled has to hold across the whole tree: thresholds sit where the code already
# is, and rules the codebase deliberately disagrees with are off, with the reason.

# Only our own sources. Without this SwiftLint also walks the SwiftPM build
# directories and lints generated test entry points.
included:
  - App
  - Packages/RFCKit/Sources
  - Packages/RFCKit/Tests
  - Packages/RFCReaderKit/Sources
  - Packages/RFCReaderKit/Tests
  - Tools/corpus-build/Sources
  - Tools/corpus-build/Tests
  - Tools/benchmarks/Benchmarks
  - Tools/benchmarks-layout/Benchmarks

disabled_rules:
  # The parsers are long, branchy state machines: LegacyTextParser alone decides
  # heading, list, table and artwork shape from indentation. Splitting them to
  # satisfy a threshold would scatter one decision across several functions.
  - cyclomatic_complexity
  - function_body_length
  - type_body_length
  - file_length

  # Trailing commas in multi-line literals are the house style, and the rule
  # flags them unless every literal has one.
  - trailing_comma

  # `String(data:encoding:)` is used where a decode failure and empty input are
  # handled the same way; the failable initializer the rule prefers buys nothing.
  - optional_data_string_conversion

  # swift-format owns layout. Where it wraps a closure's signature, the
  # parameters go on the line after the opening brace, which this rule forbids.
  - closure_parameter_position

line_length:
  warning: 200
  error: 200
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

# SwiftLint's default lengths, so a name says what it holds. Excepted: `id`;
# `x` and `y`, which are coordinates as CGPoint spells them; and `of`, one of
# RFCXML's own sectionFormat values.
identifier_name:
  excluded:
    - id
    - x
    - y
    - of

# swift-format puts the opening brace on a line of its own after a condition,
# signature or type header that wraps; the brace still opens the same block.
opening_brace:
  ignore_multiline_statement_conditions: true
  ignore_multiline_function_signatures: true
  ignore_multiline_type_headers: true

custom_rules:
  # A string a user sees is looked up in a catalog (decision "The app's chrome is
  # localized, the reader body is not"). The compiler records a SwiftUI literal or a
  # LocalizedStringResource on its own; these AppKit and UIKit APIs take a plain
  # String, which it never records, so a literal here stays English in every
  # language. A literal with no letter outside an escape or an interpolation, such
  # as an empty title or "\(name)", is not language and passes.
  localized_ui_string:
    name: Localized UI string
    included:
      - App/.*\.swift
      - Packages/RFCReaderKit/Sources/.*\.swift
    regex: '(?:(?:NSMenuItem|NSMenu|NSButton|UIAction|UIMenu|UIAlertAction|UIAlertController)\(\s*title\s*:|UIAlertController\(\s*title\s*:[^\n]*?,\s*message\s*:|[Ww]ithTitle\s*:|[Ll]abelWithString\s*:|accessibilityDescription\s*:|\.(?:label|paletteLabel|toolTip|placeholder|placeholderString|accessibilityLabel|message|messageText|informativeText|secondaryTitle|title|prompt)\s*=|setActionName\(|setAccessibilityLabel\()\s*"(?:\\\((?:[^()"\n]|"(?:\\.|[^"\\\n])*"|\((?:[^()"\n]|"(?:\\.|[^"\\\n])*")*\))*\)|\\u\{[0-9A-Fa-f]+\}|\\.|[^"\\\nA-Za-z])*+[A-Za-z]'
    excluded_match_kinds:
      - comment
      - doccomment
    message: 'Look the string up: String(localized: "…") in the app, String(kit: "…", locale: locale) in RFCReaderKit.'
    severity: error
  # On macOS, the first `systemFont(ofSize:)` or `boldSystemFont(ofSize:)` a process
  # makes, made on several threads at once, can come back as Helvetica 12 pt, and
  # each of the two has its own first use (#326). RFCReaderKit makes its fonts off
  # the main actor, in a build or a layout fragment, and its tests make them in
  # parallel. `systemFont(ofSize:weight:)` returns the same font and has no such
  # first use.
  system_font_with_weight:
    name: System font with a weight
    included:
      - Packages/RFCReaderKit/.*\.swift
    regex: '\b(?:boldSystemFont\(|systemFont\(\s*ofSize:(?:[^(),]|\((?:[^()]|\([^()]*\))*\))*\))'
    excluded_match_kinds:
      - comment
      - doccomment
    message: 'Make the font with systemFont(ofSize:weight:): the other two can return Helvetica 12 pt when first made on several threads at once (#326).'
    severity: error
  # While no monospaced system font is alive in a process, monospaced fonts made on
  # many threads at once can crash CoreText when it measures them: a `CTLine` raises
  # an uncaught `NSInvalidArgumentException` (#732). RFCReaderKit builds and the
  # app's PDF export make them off the main actor, and the tests in parallel.
  # `PlatformFont.monospacedFont(ofSize:weight:)` keeps one alive for good first.
  monospaced_font_kept:
    name: Monospaced font kept alive
    included:
      - Packages/RFCReaderKit/.*\.swift
      - App/.*\.swift
    excluded:
      - Packages/RFCReaderKit/Sources/RFCReaderKit/Rendering/MonospacedFont\.swift
    regex: '\bmonospacedSystemFont\('
    excluded_match_kinds:
      - comment
      - doccomment
    message: 'Make the font with PlatformFont.monospacedFont(ofSize:weight:): while none is alive, monospaced fonts made on many threads at once can crash CoreText (#732).'
    severity: error
  # Assigning `NSTextContentStorage.attributedString` renders perfectly but drops the
  # text storage, and with it selection, copy and link clicks (docs/ARCHITECTURE.md,
  # "TextKit 2 traps"). StorageInstallTests assigns it on purpose, to pin the trap.
  storage_install:
    name: Install through the text storage
    included:
      - App/.*\.swift
      - Packages/RFCReaderKit/.*\.swift
      - Tools/benchmarks-layout/.*\.swift
    excluded:
      - Packages/RFCReaderKit/Tests/RFCReaderKitTests/Rendering/StorageInstallTests\.swift
    regex: '\.attributedString\s*=(?!=)'
    excluded_match_kinds:
      - comment
      - doccomment
    message: 'Install text with NSTextContentStorage.install(_:); assigning attributedString drops the text storage.'
    severity: error
  # `effectiveRange:` returns the storage run, not the attribute's run, and turns a
  # decorated block into a staircase of cards (docs/ARCHITECTURE.md, "TextKit 2 traps").
  # A point lookup with `effectiveRange: nil` is fine.
  longest_effective_range:
    name: Longest effective range
    included:
      - App/.*\.swift
      - Packages/RFCReaderKit/Sources/.*\.swift
    regex: 'effectiveRange:\s*&'
    excluded_match_kinds:
      - comment
      - doccomment
    message: 'Ask for an extent with attribute(_:at:longestEffectiveRange:in:); effectiveRange stops at any attribute change.'
    severity: error
  # A bare `String(localized: "…")` in RFCReaderKit looks in the app's catalog, never
  # finds the key and stays English.
  kit_string_lookup:
    name: RFCReaderKit string lookup
    included:
      - Packages/RFCReaderKit/Sources/.*\.swift
    regex: '\bString\(\s*localized\s*:\s*"'
    excluded_match_kinds:
      - comment
      - doccomment
    message: 'In RFCReaderKit, look a string up with String(kit: "…", locale: locale).'
    severity: error
  # The app target is main-actor by default; work off the main actor is an
  # `@concurrent` function.
  no_task_detached:
    name: No detached task
    included:
      - App/.*\.swift
    regex: '\bTask\.detached\b'
    excluded_match_kinds:
      - comment
      - doccomment
    message: 'Move work off the main actor with an @concurrent function, not Task.detached.'
    severity: error
  # A test is named with a raw identifier that says what it pins,
  # @Test func `a canonical label loses its brackets`(), not a display-name string
  # and not a camel-cased sentence.
  test_raw_identifier_name:
    name: Test named by a raw identifier
    included:
      - Packages/.*/Tests/.*\.swift
      - Tools/.*/Tests/.*\.swift
    regex: '@Test(\(\s*"|(\([^()]*\))?\s+func\s+[A-Za-z_])'
    excluded_match_kinds:
      - comment
      - doccomment
    message: 'Name the test with a raw identifier, @Test func `what it pins`(), not a display-name string or a camel-cased name.'
    severity: error
