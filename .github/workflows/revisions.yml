name: Revisions

# Scans datatracker daily for adopted drafts that intend to obsolete or update an RFC,
# and publishes revisions.json to the rfc-reader R2 bucket, where the app fetches it
# from data.rfc-reader.mazetti.me (docs/superpowers/specs/2026-09-29-rfc-revisions-design.md).
# The scan record beside it lets the next run read only what changed. groups.json, the
# groups the RFC index names as datatracker describes them, is published beside it (#363).
#
# A bucket, not a release: the repository's releases are immutable, and a file replaced
# daily cannot live on one (decision "Datatracker data is published to Cloudflare R2").
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      allow-shrink:
        description: Publish even when more than half the RFCs are gone since the last run
        type: boolean
        default: false
      allow-groups-shrink:
        description: Publish groups.json even when more than half the groups are gone since the last run
        type: boolean
        default: false

# One run at a time: each reads the files the last one wrote, so two would race.
concurrency:
  group: revisions
  cancel-in-progress: false

permissions: {}

env:
  SITE: https://data.rfc-reader.mazetti.me
  BUCKET: rfc-reader

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: swift:6.3@sha256:8de8ea332a61e961ead4ef41029c2552b18e1a70dd5942d25ecf7d8de2eec5b5
    permissions:
      contents: read
    env:
      ALLOW_SHRINK: ${{ inputs.allow-shrink && '--allow-shrink' || '' }}
      ALLOW_GROUPS_SHRINK: ${{ inputs.allow-groups-shrink && '--allow-shrink' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # make for the Makefile, curl for the published files, SQLite's headers for
      # corpus-build (#174). The image carries none of them.
      - name: Install tools
        run: apt-get update -qq && apt-get install -y -qq make curl libsqlite3-dev >/dev/null

      - name: Build corpus-build
        run: make corpus-tool

      # The last published copies are the next run's baseline: the scan lets it read only
      # what changed, and both are the shrink guards' baselines. A 404 means nothing has
      # been published yet, and is a first run. Any other failure fails the run, which
      # would otherwise rescan with no baseline and so no shrink guard.
      - name: Download the previous files
        run: |
          mkdir -p out previous
          for file in revisions-scan.json groups.json; do
            status=$(curl -sS --retry 3 -o "previous/$file" -w '%{http_code}' "$SITE/$file")
            case "$status" in
              200) ;;
              404) rm -f "previous/$file" ;;
              *) echo "Fetching $file answered $status" >&2; exit 1 ;;
            esac
          done
          if [ -f previous/revisions-scan.json ]; then
            echo "SCAN=--scan previous/revisions-scan.json" >> "$GITHUB_ENV"
          fi
          if [ -f previous/groups.json ]; then
            echo "PREVIOUS_GROUPS=--previous previous/groups.json" >> "$GITHUB_ENV"
          fi

      # Unquoted on purpose: a flag that is empty must vanish, not become "".
      - name: Scan
        run: |
          # shellcheck disable=SC2086
          Tools/corpus-build/.build/release/corpus-build revisions --out out $SCAN $ALLOW_SHRINK

      # The groups the index names, for the app's working-group card (#363). A failure
      # here costs only this file a day: the bucket keeps the previous copy, and the run
      # fails after publishing the rest, so it is still seen.
      - name: Describe groups
        id: groups
        continue-on-error: true
        run: |
          # shellcheck disable=SC2086
          Tools/corpus-build/.build/release/corpus-build groups --out out $PREVIOUS_GROUPS $ALLOW_GROUPS_SHRINK

      - name: Keep the previous groups
        if: steps.groups.outcome == 'failure'
        run: rm -f out/groups.json

      # Through R2's S3 API, signed by curl itself. revisions.json goes before the scan
      # record that describes it: if the second upload fails, the next run rescans what
      # was published rather than trusting a record of what was not.
      - name: Publish
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for file in revisions.json revisions-scan.json groups.json; do
            [ -f "out/$file" ] || continue
            curl -sS --fail-with-body --retry 3 \
              --aws-sigv4 "aws:amz:auto:s3" --user "$ACCESS_KEY_ID:$SECRET_ACCESS_KEY" \
              -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" \
              -H "Content-Type: application/json" \
              -T "out/$file" "https://$ACCOUNT_ID.r2.cloudflarestorage.com/$BUCKET/$file"
          done

      - name: Fail for the groups
        if: steps.groups.outcome == 'failure'
        run: |
          echo "Describing the groups failed; the previous groups.json stays published." >&2
          exit 1
