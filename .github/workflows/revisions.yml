name: Revisions

# Scans datatracker daily for adopted drafts that intend to obsolete or update an RFC,
# and publishes revisions.json on the repository's GitHub Pages site, where the app
# fetches it (docs/superpowers/specs/2026-09-29-rfc-revisions-design.md). The scan
# record beside it lets the next run read only what changed. groups.json, the groups
# the RFC index names as datatracker describes them, is published beside it (#363).
#
# Pages, not a release: the repository's releases are immutable, and a file replaced
# daily cannot live on one (decision "Datatracker data is published on GitHub Pages").
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      allow-shrink:
        description: Publish even when more than half the RFCs are gone since the last run
        type: boolean
        default: false
      allow-groups-shrink:
        description: Publish groups.json even when more than half the groups are gone since the last run
        type: boolean
        default: false

# One run at a time: a deployment replaces the whole site, so two would race.
concurrency:
  group: revisions
  cancel-in-progress: false

permissions: {}

env:
  SITE: https://radiergummi.github.io/rfc-reader

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: swift:6.3@sha256:8de8ea332a61e961ead4ef41029c2552b18e1a70dd5942d25ecf7d8de2eec5b5
    permissions:
      contents: read
    outputs:
      site: ${{ steps.site.outputs.site }}
    env:
      ALLOW_SHRINK: ${{ inputs.allow-shrink && '--allow-shrink' || '' }}
      ALLOW_GROUPS_SHRINK: ${{ inputs.allow-groups-shrink && '--allow-shrink' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # make for the Makefile, curl for the published files, SQLite's headers for
      # corpus-build (#174). The image carries none of them.
      - name: Install tools
        run: apt-get update -qq && apt-get install -y -qq make curl libsqlite3-dev >/dev/null

      - name: Build corpus-build
        run: make corpus-tool

      # The last published copies are the next run's baseline: the scan lets it read only
      # what changed, and both are the shrink guards' baselines. A 404 means nothing has
      # been published yet, and is a first run. Any other failure fails the run, which
      # would otherwise rescan with no baseline and so no shrink guard.
      - name: Download the previous files
        run: |
          mkdir -p out previous
          for file in revisions-scan.json groups.json; do
            status=$(curl -sS --retry 3 -o "previous/$file" -w '%{http_code}' "$SITE/$file")
            case "$status" in
              200) ;;
              404) rm -f "previous/$file" ;;
              *) echo "Fetching $file answered $status" >&2; exit 1 ;;
            esac
          done
          if [ -f previous/revisions-scan.json ]; then
            echo "SCAN=--scan previous/revisions-scan.json" >> "$GITHUB_ENV"
          fi
          if [ -f previous/groups.json ]; then
            echo "PREVIOUS_GROUPS=--previous previous/groups.json" >> "$GITHUB_ENV"
          fi

      # Unquoted on purpose: a flag that is empty must vanish, not become "".
      - name: Scan
        run: |
          # shellcheck disable=SC2086
          Tools/corpus-build/.build/release/corpus-build revisions --out out $SCAN $ALLOW_SHRINK

      # The groups the index names, for the app's working-group card (#363). A failure
      # here costs only this file a day: the previous copy is published again, and the
      # run fails after the deployment, so it is still seen.
      - name: Describe groups
        id: groups
        continue-on-error: true
        run: |
          # shellcheck disable=SC2086
          Tools/corpus-build/.build/release/corpus-build groups --out out $PREVIOUS_GROUPS $ALLOW_GROUPS_SHRINK

      - name: Keep the previous groups
        if: steps.groups.outcome == 'failure'
        run: |
          rm -f out/groups.json
          if [ -f previous/groups.json ]; then cp previous/groups.json out/groups.json; fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

      - name: Mark the site ready
        id: site
        run: echo "site=ready" >> "$GITHUB_OUTPUT"

      - name: Fail for the groups
        if: steps.groups.outcome == 'failure'
        run: |
          echo "Describing the groups failed; the previous groups.json was published again." >&2
          exit 1

  deploy:
    needs: scan
    if: ${{ !cancelled() && needs.scan.outputs.site == 'ready' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
