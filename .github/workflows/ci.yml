name: CI

on:
  push:
    branches: [main]
  # The default types: marking a draft ready for review starts no run here, as
  # nothing changed since its last push. The macOS jobs are in ci-macos.yml.
  pull_request:

# Every job only checks out and builds; none writes to the repository.
permissions:
  contents: read

# A new push to a pull request supersedes the run before it; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Same version as `make lint` locally; --strict is clean on the whole tree.
    container: ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swiftlint lint --strict

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # reviewdog reports actionlint's findings as a check run.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b # v1.77.0
        with:
          # Every finding in every workflow fails the job, not only those in lines
          # a pull request touches.
          reporter: github-check
          filter_mode: nofilter
          fail_level: error
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          inputs: .github/workflows
          # Findings fail the job instead of going to code scanning. Online audits
          # (whether each pinned commit really belongs to its action) are on by default.
          advanced-security: false

  rfckit-linux:
    name: RFCKit tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.3@sha256:8de8ea332a61e961ead4ef41029c2552b18e1a70dd5942d25ecf7d8de2eec5b5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # In the SwiftPM keys, so a new image starts from a clean .build rather than
      # restoring one another compiler made.
      - name: Toolchain
        id: toolchain
        run: |
          swift --version
          echo "hash=$(swift --version 2>&1 | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # Each package's .build, restored from main's newest run and saved only from
      # main, like ci-macos.yml's compilation cache. Keyed on the manifests and pins, so a
      # dependency change starts cold rather than from a build of other versions;
      # sources are not in the key, since SwiftPM rebuilds what changed on its own.
      # Older entries are deleted by the prune job below.
      # The paths are one level deep on purpose: `**/Package.swift` also matches the
      # dependencies' manifests under .build once a build has run, so the key the
      # save step computed would never be the key a later restore asks for.
      - name: Restore the SwiftPM builds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Packages/RFCKit/.build
            Tools/corpus-build/.build
          key: swiftpm-linux-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved', 'Tools/*/Package.swift', 'Tools/*/Package.resolved', '!Tools/benchmarks/**') }}-${{ github.sha }}
          restore-keys: swiftpm-linux-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved', 'Tools/*/Package.swift', 'Tools/*/Package.resolved', '!Tools/benchmarks/**') }}-
      - run: swift test --package-path Packages/RFCKit
      - run: swift test --package-path Tools/corpus-build
      - name: Save the SwiftPM builds
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Packages/RFCKit/.build
            Tools/corpus-build/.build
          key: swiftpm-linux-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved', 'Tools/*/Package.swift', 'Tools/*/Package.resolved', '!Tools/benchmarks/**') }}-${{ github.sha }}

  prune-caches:
    name: Prune caches
    # Every save above keys its entry on the commit, so each push to main adds one
    # per job, and the repository's 10 GB went to 36 compilation caches with nothing
    # pruned. A restore only ever takes the newest entry of a kind, so the rest are
    # deleted. After the saves, and on main only, where the saves happen. The corpus
    # workflow's fetched text (corpus-text-, about 450 MB a run) is pruned here too;
    # ci-macos.yml prunes its own caches.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: [rfckit-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # To delete caches; the job checks nothing out.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Keep the newest cache of each kind
        run: |
          for prefix in swiftpm-linux- corpus-text-; do
            gh cache list --key "$prefix" --ref refs/heads/main --sort created_at --order desc \
              --limit 100 --json id --jq '.[1:][].id' |
              xargs -r -n1 gh cache delete
          done

  swift-format:
    name: swift-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 6.3 formats this tree byte for byte as Xcode 27's swift-format does. The image
    # has no make, and a fresh checkout has no .build to keep --recursive out of.
    container: swift:6.3@sha256:8de8ea332a61e961ead4ef41029c2552b18e1a70dd5942d25ecf7d8de2eec5b5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift format lint --strict --recursive --parallel App Packages Tools
