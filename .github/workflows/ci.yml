name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rfckit-macos:
    name: RFCKit tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
      - run: swift --version
      - run: swift test --package-path Packages/RFCKit

  rfckit-linux:
    name: RFCKit tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/RFCKit
      - run: swift build --package-path Tools/corpus-build
