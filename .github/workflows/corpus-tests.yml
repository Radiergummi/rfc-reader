name: Corpus-backed tests

# The RFCKit, corpus-build and RFCReaderKit suites that read whole RFCs
# (`Corpus-backed: ...`), which `make check` and CI skip because the documents are
# fetched, not committed. On every pull request that changes what they test or read, so a
# heuristic change cannot merge without them (#243); weekly, for what changes on
# the RFC Editor's side; and on demand. The documents are fetched fresh each time.
on:
  # ready_for_review too, for the macOS job, which skips a draft.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Packages/RFCKit/**
      - Packages/RFCReaderKit/**
      - Tools/corpus-build/**
      - corpus/overrides/**
      - Makefile
      - .github/workflows/corpus-tests.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-corpus:
    name: Corpus-backed tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.3@sha256:8de8ea332a61e961ead4ef41029c2552b18e1a70dd5942d25ecf7d8de2eec5b5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # make and curl, and SQLite's headers for corpus-build (#174). The image
      # carries none of them.
      - name: Install tools
        run: apt-get update -qq && apt-get install -y -qq make curl libsqlite3-dev >/dev/null
      # Fetches the documents in the Makefile's CORPUS_TEST_DOCUMENTS, checks every
      # document a test reads is among them, and runs the suites.
      - run: make test-corpus

  # RFCReaderKit builds on a Mac only, so its suites run here, alone: the job above
  # has run the rest. Not for a draft, as ci-macos.yml's macOS jobs are not.
  test-corpus-macos:
    name: Corpus-backed tests (macOS)
    if: ${{ !github.event.pull_request.draft }}
    # Xcode 26.4, as ci-macos.yml's package tests: the first to ship Swift 6.3.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - run: make test-corpus-app
