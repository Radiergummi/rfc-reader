name: Release

# On a version tag, builds the Mac app with Developer ID, notarizes it, attests its
# provenance and makes a draft release with the disk image (#911). Adapted from
# meetingFocus's release workflow.
#
# Two signatures, kept apart: GitHub attests the build, so a download can be traced
# to the commit and the run that made it; the maintainer signs the update feed on
# their own machine, so this workflow alone cannot ship an update. The release is a
# draft for that reason: the maintainer publishes it, which makes it immutable, and
# only then signs the feed.
on:
  push:
    tags: ["v*"]

# One run per tag; a second tag runs beside it rather than cancelling a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Everything that builds, the dependencies' code included, runs here, with
  # nothing it could write to or attest with.
  build:
    name: Build and notarize
    runs-on: macos-26
    # Cold test builds, a cold archive and two notarizations, each waited for.
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dmg: ${{ steps.build.outputs.dmg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Xcode ci-macos.yml tests the packages with, for the same reason: the
      # gate is the one every pull request passed.
      - name: Select Xcode for the tests
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app && xcodebuild -version

      - name: Install XcodeGen
        run: make xcodegen-install

      # The tag says which version ships, and project.yml says which version the app
      # calls itself; a release where they differ is refused before anything is signed.
      - name: Check the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/.*CFBundleShortVersionString: &version "\(.*\)".*/\1/p' project.yml)
          if [ "$version" != "$declared" ]; then
            echo "The tag $GITHUB_REF_NAME does not match version $declared in project.yml." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A release is built from reviewed source only: a tag on a commit main does not
      # contain would be signed and attested exactly as a real release is.
      - name: Check the commit is on main
        run: |
          # The checkout is one commit deep; the whole history of both is what is compared.
          git fetch --no-tags --unshallow origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "$GITHUB_REF_NAME is not on main; tag a commit main contains." >&2
            exit 1
          fi

      # Sparkle offers only a higher build number, and once the draft is published it
      # cannot be rebuilt, so a run number the feed has already passed (this file
      # renamed restarts it at 1) is refused here, not by `make appcast` after. No feed
      # yet, or none reachable, is left to `make appcast`.
      - name: Check the build number
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          published=$(curl -sf --max-time 20 https://rfc-reader.mazetti.me/appcast.xml \
            | sed -n 's/.*<sparkle:version>\([0-9]*\)<.*/\1/p' | sort -n | tail -1) || true
          if [ -n "$published" ] && [ "$BUILD_NUMBER" -le "$published" ]; then
            echo "Build $BUILD_NUMBER is not above the published build $published." >&2
            exit 1
          fi

      # Every secret and variable the signing needs, checked before the long tests
      # rather than after them.
      - name: Check the signing inputs
        env:
          SIGNING_DATA: ${{ secrets.SIGNING_DATA }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          APPLE_API_KEY_DATA: ${{ secrets.APPLE_API_KEY_DATA }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        shell: bash
        run: |
          for name in SIGNING_DATA SIGNING_PASSWORD APPLE_API_KEY_DATA APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "The $name secret or variable is not set." >&2
              exit 1
            fi
          done

      # Gates before anything is signed: a signed artifact is one somebody might install.
      - name: Test
        run: make test test-app

      # The Xcode the app build in ci-macos.yml uses, for the same reason.
      - name: Select Xcode for the build
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version

      - name: Install the signing material
        env:
          SIGNING_DATA: ${{ secrets.SIGNING_DATA }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          APPLE_API_KEY_DATA: ${{ secrets.APPLE_API_KEY_DATA }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
        run: .github/scripts/signing.sh

      # The run number is the build number: Sparkle orders updates by CFBundleVersion,
      # and the run number only grows. It is counted per workflow, so renaming this
      # file would start it at 1 again; "Check the build number" refuses that.
      - name: Build, notarize and package
        id: build
        env:
          NOTARY_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          BUILD_NUMBER: ${{ github.run_number }}
        # Named, so the step runs with pipefail: by default a failing script would
        # pass as tee's success.
        shell: bash
        run: |
          .github/scripts/release.sh | tee "$RUNNER_TEMP/release.log"
          dmg=$(tail -1 "$RUNNER_TEMP/release.log")
          test -f "$dmg"
          echo "dmg=$(basename "$dmg")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: disk-image
          path: build/${{ steps.build.outputs.dmg }}
          if-no-files-found: error

  # Only what attests and publishes holds the permissions to.
  release:
    name: Attest and draft the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the draft release
      id-token: write # the token the attestation is bound to
      attestations: write # the attestation
    steps:
      # The release notes' template; nothing is built here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: disk-image
          path: dist

      # Binds this disk image to this commit, workflow and run, which anyone can
      # check with `gh attestation verify`.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ needs.build.outputs.dmg }}

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          DMG: dist/${{ needs.build.outputs.dmg }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          sha256=$(sha256sum "$DMG" | cut -d' ' -f1)
          sed -e "s|VERSION_PLACEHOLDER|$VERSION|g" \
            -e "s|SHA256_PLACEHOLDER|$sha256|g" \
            -e "s|RUN_URL_PLACEHOLDER|$RUN_URL|g" \
            -e "s|ATTESTATION_URL_PLACEHOLDER|$ATTESTATION_URL|g" \
            -e "s|COMMIT_PLACEHOLDER|$COMMIT|g" \
            -e "s|REPOSITORY_PLACEHOLDER|$GITHUB_REPOSITORY|g" \
            .github/templates/release.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$DMG" --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "RFC Reader $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
