name: Corpus packs

# Builds the data packs described in docs/DATA_PIPELINE.md. Manual for now: the first
# full run should be reviewed (corpus/report.json) before anything is published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Pack version, e.g. 2026.09
        required: true
      limit:
        description: Only process the first N legacy RFCs (smoke test); leave empty for all
        required: false
        default: ""
      publish:
        description: Attach packs to a GitHub release
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # A full run fetches and converts all 8,464 legacy RFCs; this only stops a hung one.
    timeout-minutes: 180
    container: swift:6.1@sha256:3991e5dd5c40b04580c1e56f1ad6042f3173829b1995ffa53b84957371c25876
    # write only for the optional `gh release create` in the last step.
    permissions:
      contents: write
    # Inputs reach the scripts as environment variables, never spliced into their text.
    env:
      VERSION: ${{ inputs.version }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Restore fetched text
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: corpus/text.noindex
          key: corpus-text-${{ github.run_id }}
          restore-keys: corpus-text-

      - name: Build corpus-build
        run: swift build -c release --package-path Tools/corpus-build

      - name: Fetch legacy RFCs
        run: Tools/corpus-build/.build/release/corpus-build fetch --out corpus ${LIMIT:+--limit "$LIMIT"}

      - name: Convert to RFCXML
        run: |
          apt-get update -qq && apt-get install -y -qq libxml2-utils >/dev/null
          Tools/corpus-build/.build/release/corpus-build convert \
            --in corpus/text.noindex --out corpus/xml.noindex --overrides corpus/overrides --report corpus/report.json \
            --schema Tools/corpus-build/Schema/v3.rng

      - name: Manifest
        run: Tools/corpus-build/.build/release/corpus-build manifest --dir corpus/xml.noindex --out corpus/manifest.json --version "$VERSION"

      - name: Pack
        run: |
          apt-get update -qq && apt-get install -y -qq zstd >/dev/null
          # convert writes xml.noindex (kept out of Spotlight); the pack's directory is xml.
          tar --zstd -cf "legacy-xml-${{ inputs.version }}.tar.zst" -C corpus --transform 's,^xml\.noindex,xml,' xml.noindex manifest.json
          ls -la *.tar.zst

      - name: Upload report and packs as workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-${{ inputs.version }}
          path: |
            corpus/report.json
            corpus/manifest.json
            legacy-xml-*.tar.zst

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get install -y -qq gh >/dev/null
          gh release create "corpus-$VERSION" legacy-xml-*.tar.zst corpus/manifest.json \
            --title "Corpus packs $VERSION" \
            --notes "Data packs built by the corpus workflow. See docs/DATA_PIPELINE.md."
