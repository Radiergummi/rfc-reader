name: Corpus packs

# Builds the data packs described in docs/DATA_PIPELINE.md. Manual for now: the first
# full run should be reviewed (corpus/report.json) before anything is published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Pack version, e.g. 2026.09
        required: true
      limit:
        description: Only process the first N legacy RFCs (smoke test); leave empty for all
        required: false
        default: ""
      publish:
        description: Attach packs to a GitHub release
        type: boolean
        default: false
      publish_indexes:
        description: Publish the indexes pack the app bundles as release indexes-<version> (version YYYY.MM.N)
        type: boolean
        default: false

# Only the publish jobs write, and they build nothing.
permissions:
  contents: read

# One run at a time, queued rather than canceled: a full run takes hours, and each
# full run's baseline is the report of the last full one to succeed.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # A full run fetches and converts the 8,457 legacy RFCs that have a text file; this only stops a hung one.
    timeout-minutes: 180
    container: swift:6.3@sha256:8de8ea332a61e961ead4ef41029c2552b18e1a70dd5942d25ecf7d8de2eec5b5
    # Read-only: this job compiles and runs third-party packages. actions: read to
    # download the previous run's report.
    permissions:
      contents: read
      actions: read
    # Inputs reach the scripts as environment variables, never spliced into their text.
    env:
      VERSION: ${{ inputs.version }}
      LIMIT: ${{ inputs.limit }}
    steps:
      # The app orders indexes packs by their version, number by number, so one to
      # be published is dated and counted, 2026.10.1: refused before hours of build.
      - name: Check the indexes pack's version
        if: ${{ inputs.publish_indexes }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::The indexes pack's version is YYYY.MM.N, not $VERSION."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore fetched text
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus/text.noindex
          key: corpus-text-${{ github.run_id }}
          restore-keys: corpus-text-

      # make for the Makefile, curl for its downloads, xmllint for the schema check, gh for the previous
      # report, SQLite's headers for the index database (#174). The image carries
      # none of them.
      - name: Install tools
        run: apt-get update -qq && apt-get install -y -qq make curl libxml2-utils gh libsqlite3-dev >/dev/null

      # The report of the last successful full run is this run's baseline: convert
      # compares its schema results with the report it replaces and fails on any
      # document that stopped validating. Only a full run uploads one, since a smoke
      # run's twenty documents would compare nothing else, so the recent successful
      # runs are looked through for the newest that has it. A failed run's report is
      # never the baseline, so a regression keeps failing until it is fixed. Without
      # one nothing is compared, which is said as a warning rather than passed over.
      - name: Restore the previous report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow corpus.yml \
            --status success --limit 20 --json databaseId --jq '.[].databaseId')
          for run in $runs; do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name corpus-baseline \
              --dir baseline 2>/dev/null; then
              mkdir -p corpus
              cp baseline/report.json corpus/report.json
              echo "Baseline: the report of run $run"
              exit 0
            fi
          done
          echo "::warning::No previous full run's report; schema regressions are not checked in this run."

      # The same entry point as a local `make corpus`, so CI builds the corpus a
      # developer does: the modern RFCXML documents fetched beside the converted
      # ones, and the prose diagnostics written. An empty LIMIT is the full set.
      - name: Fetch, convert, index, manifest
        run: make corpus CORPUS_LIMIT="$LIMIT" CORPUS_VERSION="$VERSION"

      # About 450 MB, so saved by full runs only: a smoke run's twenty documents
      # would otherwise become the newest entry, and CI's cache pruning keeps only
      # the newest of each kind. Saved even when convert failed, since the fetch did
      # not.
      - name: Save fetched text
        if: ${{ !cancelled() && inputs.limit == '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus/text.noindex
          key: corpus-text-${{ github.run_id }}

      # Two packs from the one directory, split at RFC 8650: the converted legacy
      # documents wait on the IETF Trust's answer about redistribution, and the
      # RFC Editor's own RFCXML, already licensed for it, must not wait with them
      # (docs/DATA_PIPELINE.md). Each pack is a folder of its documents with a
      # manifest of its own at its root, listing exactly those files, which is what
      # the app verifies an installed pack against. corpus/manifest.json still
      # lists both. A third pack holds the index database (#174), which carries no
      # RFC text and so waits on nothing.
      - name: Pack
        run: |
          mkdir -p packs/legacy-xml packs/modern-xml packs/indexes
          cp corpus/indexes.sqlite packs/indexes/
          cd corpus/xml.noindex
          # rfcNNNN.xml: the second field between "c" and "." is the number.
          find . -maxdepth 1 -name 'rfc*.xml' -printf '%f\n' | sort -V |
            awk -F'[c.]' '{ print > (($2 + 0 >= 8650) ? "../modern.list" : "../legacy.list") }'
          touch ../legacy.list ../modern.list
          for pack in legacy modern; do
            xargs -a "../$pack.list" -r cp -t "$GITHUB_WORKSPACE/packs/$pack-xml"
            echo "$pack: $(wc -l < "../$pack.list") documents"
          done
          cd "$GITHUB_WORKSPACE"
          # Written outside the folder and then moved in, so it does not list itself.
          # The legacy pack's also lists what convert skipped, from its report (#316).
          for pack in legacy-xml modern-xml indexes; do
            report=
            if [ "$pack" = legacy-xml ]; then report="--report corpus/report.json"; fi
            # shellcheck disable=SC2086 # $report is two words, or none.
            Tools/corpus-build/.build/release/corpus-build manifest \
              --dir "packs/$pack" --out "packs/$pack.json" --version "$VERSION" $report
            mv "packs/$pack.json" "packs/$pack/manifest.json"
          done

      # Also when convert failed on a regression: the report names the documents.
      # Only what carries no legacy RFC text, at the default retention: the
      # repository is public, so any signed-in user can download an artifact.
      - name: Upload report and pack folders as workflow artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-${{ inputs.version }}
          path: |
            corpus/report.json
            corpus/manifest.json
            packs/modern-xml/
            packs/indexes/

      # The legacy pack's text and prose.json, which quotes the first line of RFC
      # blocks, wait on the IETF Trust's answer (#215, docs/DATA_PIPELINE.md). Until
      # the repository variable LEGACY_PACK_CLEARED is 'true' they are kept for a day,
      # long enough to review the run, and never archived or released.
      - name: Upload the legacy pack and prose diagnostics for a day
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-${{ inputs.version }}-legacy
          # 0 is the repository's default, once the pack may be published. Written as
          # not-cleared first: 0 is falsy, so `cleared && 0 || 1` is always 1.
          retention-days: ${{ vars.LEGACY_PACK_CLEARED != 'true' && 1 || 0 }}
          path: |
            corpus/prose.json
            packs/legacy-xml/

      # The next run's baseline, on its own so that run downloads one small file:
      # only a full run's, and only a successful one's.
      - name: Upload the report as the next run's baseline
        if: ${{ inputs.limit == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-baseline
          path: corpus/report.json

  # Apple Archive with LZFSE, which the app reads with Apple's own frameworks and so
  # gains no dependency for (#36). Nothing on Linux writes the Apple Archive
  # container, so the archive is made here, by `aa`, Apple's own writer of it.
  archive:
    needs: build
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      LEGACY_PACK_CLEARED: ${{ vars.LEGACY_PACK_CLEARED == 'true' }}
    steps:
      - name: Download the pack folders
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corpus-${{ inputs.version }}

      - name: Download the legacy pack folder
        if: ${{ vars.LEGACY_PACK_CLEARED == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corpus-${{ inputs.version }}-legacy

      - name: Archive
        run: |
          packs="modern-xml indexes"
          if [ "$LEGACY_PACK_CLEARED" = true ]; then packs="legacy-xml $packs"; fi
          for pack in $packs; do
            aa archive -a lzfse -d "packs/$pack" -o "$pack-$VERSION.aar"
          done
          ls -la ./*.aar

      # With the manifest of both, which the release carries beside them once the
      # legacy pack is cleared.
      - name: Upload packs as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packs-${{ inputs.version }}
          path: |
            *.aar
            corpus/manifest.json

  # The only job that can write to the repository: it checks nothing out and runs
  # no code of ours or anyone's, only gh over the artifact the archive job uploaded.
  publish:
    if: ${{ inputs.publish }}
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # For `gh release create`; actions: read to download this run's artifact.
      contents: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LEGACY_PACK_CLEARED: ${{ vars.LEGACY_PACK_CLEARED == 'true' }}
    steps:
      # Tagged at the commit that built the packs, not the default branch's head: a
      # run takes hours and can come from any ref.
      - name: Publish release
        run: |
          gh run download "$GITHUB_RUN_ID" --name "packs-$VERSION" --dir packs
          # The manifest of both packs lists the legacy documents too, so it goes
          # only with the legacy pack; each archive carries its own pack's manifest.
          legacy=()
          if [ "$LEGACY_PACK_CLEARED" = true ]; then
            legacy=(packs/legacy-xml-*.aar packs/corpus/manifest.json)
          fi
          gh release create "corpus-$VERSION" --target "$GITHUB_SHA" \
            "${legacy[@]}" packs/modern-xml-*.aar \
            packs/indexes-*.aar \
            --title "Corpus packs $VERSION" \
            --notes "Data packs built by the corpus workflow. See docs/DATA_PIPELINE.md."

  # The indexes pack the app bundles (#738), as a release of its own, one per pack
  # version: the repository's releases are immutable, so it is made a draft, given
  # the pack's two files, and only then published, after which neither can change.
  # App/indexes-pack.mk pins the tag and the files' SHA-256, which the run's summary
  # prints for it. Like publish, it checks nothing out and runs only gh over the
  # build job's artifact.
  publish-indexes:
    # Never a smoke run's: a release cannot be replaced, so a partial pack would use
    # up its version.
    if: ${{ inputs.publish_indexes && inputs.limit == '' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # For `gh release`; actions: read to download this run's artifact.
      contents: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish release
        run: |
          gh run download "$GITHUB_RUN_ID" --name "corpus-$VERSION" --dir corpus-artifact
          cd corpus-artifact/packs/indexes
          tag="indexes-$VERSION"
          # A re-run after a failed upload finds its draft and uploads again.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "Indexes pack $VERSION" \
              --notes "The corpus's index database the app bundles (#738). See docs/DATA_PIPELINE.md."
          fi
          gh release upload "$tag" indexes.sqlite manifest.json --clobber
          gh release edit "$tag" --draft=false
          {
            echo "Pin it in App/indexes-pack.mk:"
            echo
            echo '```make'
            echo "INDEXES_PACK_TAG := $tag"
            echo "INDEXES_PACK_SQLITE_SHA256 := $(sha256sum indexes.sqlite | cut -d' ' -f1)"
            echo "INDEXES_PACK_MANIFEST_SHA256 := $(sha256sum manifest.json | cut -d' ' -f1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
