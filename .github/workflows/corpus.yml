name: Corpus packs

# Builds the data packs described in docs/DATA_PIPELINE.md. Manual for now: the first
# full run should be reviewed (corpus/report.json) before anything is published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Pack version, e.g. 2026.09
        required: true
      limit:
        description: Only process the first N legacy RFCs (smoke test); leave empty for all
        required: false
        default: ""
      publish:
        description: Attach packs to a GitHub release
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # A full run fetches and converts all 8,464 legacy RFCs; this only stops a hung one.
    timeout-minutes: 180
    container: swift:6.3@sha256:8de8ea332a61e961ead4ef41029c2552b18e1a70dd5942d25ecf7d8de2eec5b5
    # write only for the optional `gh release create` in the last step.
    permissions:
      contents: write
    # Inputs reach the scripts as environment variables, never spliced into their text.
    env:
      VERSION: ${{ inputs.version }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore fetched text
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus/text.noindex
          key: corpus-text-${{ github.run_id }}
          restore-keys: corpus-text-

      # make for the Makefile, xmllint for the schema check, zstd for the pack. The
      # image carries none of them.
      - name: Install tools
        run: apt-get update -qq && apt-get install -y -qq make libxml2-utils zstd >/dev/null

      # The same entry point as a local `make corpus`, so CI builds the corpus a
      # developer does: the modern RFCXML documents fetched beside the converted
      # ones, and the prose diagnostics written. An empty LIMIT is the full set.
      - name: Fetch, convert, manifest
        run: make corpus CORPUS_LIMIT="$LIMIT" CORPUS_VERSION="$VERSION"

      - name: Pack
        run: |
          # convert writes xml.noindex (kept out of Spotlight); the pack's directory is xml.
          tar --zstd -cf "legacy-xml-$VERSION.tar.zst" -C corpus --transform 's,^xml\.noindex,xml,' xml.noindex manifest.json
          ls -la ./*.tar.zst

      - name: Upload report and packs as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-${{ inputs.version }}
          path: |
            corpus/report.json
            corpus/prose.json
            corpus/manifest.json
            legacy-xml-*.tar.zst

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get install -y -qq gh >/dev/null
          gh release create "corpus-$VERSION" legacy-xml-*.tar.zst corpus/manifest.json \
            --title "Corpus packs $VERSION" \
            --notes "Data packs built by the corpus workflow. See docs/DATA_PIPELINE.md."
