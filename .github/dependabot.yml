version: 2

# One grouped pull request per ecosystem per week, for releases at least three days old.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]

  # corpus-build and the two benchmarks packages have remote dependencies; RFCKit
  # and RFCReaderKit depend on nothing but each other, by path. Both benchmarks
  # packages pin package-benchmark exactly, to the same release, so one grouped pull
  # request moves them together.
  - package-ecosystem: swift
    directories:
      - /Tools/corpus-build
      - /Tools/benchmarks
      - /Tools/benchmarks-layout
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      swift:
        patterns: ["*"]
