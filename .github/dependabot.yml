version: 2

# One grouped pull request per ecosystem per week, for releases at least three days old.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]

  # Only corpus-build has remote dependencies; RFCKit and RFCReaderKit depend on
  # nothing but each other, by path.
  - package-ecosystem: swift
    directory: /Tools/corpus-build
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      swift:
        patterns: ["*"]
