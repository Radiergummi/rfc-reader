# XcodeGen project spec. `make xcodeproj` runs `xcodegen generate` (the pinned
# release from `make xcodegen-install`, or Homebrew's) to produce
# RFCReader.xcodeproj; edit this file, never the generated project.
name: RFCReader
options:
  bundleIdPrefix: me.mazetti
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.4"

settings:
  base:
    # Swift 6 is the language mode; there is no 6.2 mode. The 6.2 behaviour is the
    # two settings on the RFCReader target (#129). Complete strict concurrency is
    # Swift 6's default, so it is not spelled out.
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TH593VRB6W

packages:
  RFCKit:
    path: Packages/RFCKit
  RFCReaderKit:
    path: Packages/RFCReaderKit

targets:
  RFCReader:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/RFCReader
        excludes:
          - Scripting/RFCReader.sdef
      # The scripting dictionary is a Mac's alone; iOS has App Intents.
      - path: App/RFCReader/Scripting/RFCReader.sdef
        destinationFilters: [macOS]
        buildPhase: resources
      # One app icon per Xcode version; the settings below pick which is built.
      - path: App/icons
    dependencies:
      - package: RFCKit
      - package: RFCReaderKit
    info:
      path: App/RFCReader/Info.plist
      properties:
        CFBundleDisplayName: RFC Reader
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.reference
        # The contact card an author chip opens can add the author to Contacts (#19).
        NSContactsUsageDescription: RFC Reader adds an RFC author to your contacts when you ask it to.
        # Read by macOS only; see App/RFCReader/Scripting.
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: RFCReader.sdef
        CFBundleURLTypes:
          - CFBundleURLName: org.rfc-editor.document
            CFBundleURLSchemes: [rfc]
        UILaunchScreen: {}
        # iPad opens an RFC in a window of its own (#158); an iPhone has one scene
        # whatever this says.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # The activity a new window is asked for with (`SceneRequest.activityType`),
        # declared so the scene is handed it.
        NSUserActivityTypes:
          - me.mazetti.rfc-reader.open
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/RFCReader/RFCReader.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # Option-clicking a format in the Info pane saves it to Downloads (#25).
        com.apple.security.files.downloads.read-write: true
        # File > Print… (#375). Without it the sandbox refuses the print panel with
        # "This application does not support printing"; Page Setup works either way.
        com.apple.security.print: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.mazetti.rfc-reader
        # The app is UI throughout, so its code is main-actor unless it says
        # otherwise. On this target, not the project: the packages keep nonisolated
        # defaults, as `DocumentTextBuilder` requires, and so would any other target.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        # Icon Composer 27 saves refractivity, which Xcode 26's actool crashes on
        # rather than ignores, so the variant it cannot read is not even an input.
        ASSETCATALOG_COMPILER_APPICON_NAME: $(APP_ICON_$(XCODE_VERSION_MAJOR))
        APP_ICON_2600: AppIcon-26
        APP_ICON_2700: AppIcon-27
        EXCLUDED_SOURCE_FILE_NAMES: AppIcon-*.icon
        INCLUDED_SOURCE_FILE_NAMES: $(ASSETCATALOG_COMPILER_APPICON_NAME).icon
