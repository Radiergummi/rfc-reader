# XcodeGen project spec. `make xcodeproj` runs `xcodegen generate` (the pinned
# release from `make xcodegen-install`, or Homebrew's) to produce
# RFCReader.xcodeproj; edit this file, never the generated project.
name: RFCReader
options:
  bundleIdPrefix: me.mazetti
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  # The language the strings in the code are written in, and the string
  # catalogs' source language.
  developmentLanguage: en
  xcodeVersion: "26.4"

settings:
  base:
    # Swift 6 is the language mode; there is no 6.2 mode. The 6.2 behavior is the
    # two settings on the RFCReader target (#129). Complete strict concurrency is
    # Swift 6's default, so it is not spelled out.
    SWIFT_VERSION: "6.0"
    # The tree has no warnings, and a new one fails the build (#440).
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    CODE_SIGN_STYLE: Automatic
    # The compiler records every localizable string it sees in a .stringsdata
    # file, which `make strings` syncs into the string catalogs.
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    DEVELOPMENT_TEAM: TH593VRB6W
    # The build number, 1 for every local build; the release workflow passes its
    # run number (#911).
    CURRENT_PROJECT_VERSION: "1"
    # Notarization requires the hardened runtime; it applies to macOS only.
    ENABLE_HARDENED_RUNTIME: "YES"

packages:
  RFCKit:
    path: Packages/RFCKit
  RFCReaderKit:
    path: Packages/RFCReaderKit
  # Updates for the Mac app outside the App Store (#911); see Window/Updater.swift.
  # The commit of 2.10.0, not the tag: Package.resolved is inside the generated,
  # ignored project, so a range, or a tag moved upstream, would let a release build
  # resolve a Sparkle nobody reviewed.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    revision: eef1a539a373c1f1a320624b1130fc5de7b2e100

targets:
  RFCReader:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/RFCReader
        excludes:
          - Scripting/RFCReader.sdef
      # The scripting dictionary is a Mac's alone; iOS has App Intents.
      - path: App/RFCReader/Scripting/RFCReader.sdef
        destinationFilters: [macOS]
        buildPhase: resources
      # One app icon per Xcode version; the settings below pick which is built.
      - path: App/icons
    # The RFC index, for a first launch to list every RFC offline (#770):
    # `make bundled-index` fetches it into App/Resources, which git ignores, and
    # `DocumentStore.cachedIndexLocation()` reads it until the app has one of its own.
    # A phase rather than a resource, because a resource that is missing fails every
    # build, and a Debug build bundles it only when it is there. Copied with its
    # date, which is when it was fetched, and which the app shows as when it was
    # current.
    postBuildScripts:
      - name: Bundle the RFC index
        basedOnDependencyAnalysis: false
        script: |
          index="$SRCROOT/App/Resources/rfc-index.xml"
          bundled="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/rfc-index.xml"
          if [ -f "$index" ]; then
            cp -p "$index" "$bundled"
          elif [ "$CONFIGURATION" = Release ]; then
            echo "error: A Release build bundles the RFC index: run make bundled-index first."
            exit 1
          else
            # Not one an earlier build left behind.
            rm -f "$bundled"
          fi
    dependencies:
      - package: RFCKit
      - package: RFCReaderKit
      - package: Sparkle
        destinationFilters: [macOS]
      # The Safari extension, embedded on both platforms (#194).
      - target: RFCReaderSafari
    info:
      path: App/RFCReader/Info.plist
      properties:
        CFBundleDisplayName: RFC Reader
        # The version, set here only: XcodeGen writes these into Info.plist as they
        # are, so a MARKETING_VERSION build setting beside them was never read. The
        # build number is the one build setting, CURRENT_PROJECT_VERSION, so that the
        # release workflow can set it per release: Sparkle orders updates by it (#911).
        CFBundleShortVersionString: &version "0.1.0"
        CFBundleVersion: &build $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.reference
        # The contact card an author chip opens can add the author to Contacts (#19).
        NSContactsUsageDescription: RFC Reader adds an RFC author to your contacts when you ask it to.
        # Read by macOS only; see App/RFCReader/Scripting.
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: RFCReader.sdef
        CFBundleURLTypes:
          - CFBundleURLName: org.rfc-editor.document
            CFBundleURLSchemes: [rfc]
        # Services ▸ Replace with RFC Link and Open in RFC Reader, for selected text in
        # any app (#195); see Window/CitationServices.swift. Read by macOS only. An
        # empty NSRequiredContext is what enables a Service without a trip to System
        # Settings.
        NSServices:
          - NSMenuItem:
              default: Replace with RFC Link
            NSMessage: replaceWithRFCLink
            NSPortName: $(PRODUCT_NAME)
            NSSendTypes: [public.utf8-plain-text]
            NSReturnTypes: [public.utf8-plain-text]
            NSRequiredContext: {}
          - NSMenuItem:
              default: Open in RFC Reader
            NSMessage: openInRFCReader
            NSPortName: $(PRODUCT_NAME)
            NSSendTypes: [public.utf8-plain-text]
            NSRequiredContext: {}
        UILaunchScreen: {}
        # Sparkle's update feed and the public half of the EdDSA key its updates are
        # signed with (#911); read by macOS only. The private half is in the
        # maintainer's keychain, and losing it means no installed copy can be updated
        # again.
        SUFeedURL: https://rfc-reader.mazetti.me/appcast.xml
        SUPublicEDKey: qif0+j8cimHQhgje/uAIcGSO/O7lfnSGey8PlVS0jU0=
        # Checks on its own without asking first; Settings turns it off. Only a release
        # build starts the updater (Window/Updater.swift).
        SUEnableAutomaticChecks: true
        # The app is sandboxed, so Sparkle installs through its launcher service,
        # which the mach-lookup exceptions in the entitlements let it reach.
        SUEnableInstallerLauncherService: true
        # The daily check of the bookmarked RFCs on iOS (#191), a `BGAppRefreshTask`
        # (`BookmarkNotifications.refreshIdentifier`). macOS reads neither key.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - me.mazetti.rfc-reader.bookmark-refresh
        # iPad opens an RFC in a window of its own (#158); an iPhone has one scene
        # whatever this says.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # The activity a new window is asked for with (`SceneRequest.activityType`),
        # declared so the scene is handed it.
        NSUserActivityTypes:
          - me.mazetti.rfc-reader.open
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/RFCReader/RFCReader.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Export's save panel and the debug Install Data Pack… open panel.
        com.apple.security.files.user-selected.read-write: true
        # Option-clicking a format in the Info pane saves it to Downloads (#25).
        com.apple.security.files.downloads.read-write: true
        # File > Print… (#375). Without it the sandbox refuses the print panel with
        # "This application does not support printing"; Page Setup works either way.
        com.apple.security.print: true
        # Sparkle's installer services, reached by name from the sandbox (#911).
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.mazetti.rfc-reader
        # Where a Mac app's embedded frameworks are, Sparkle's among them (#911). The
        # target's default is iOS's flat bundle, @executable_path/Frameworks, which
        # nothing needed until a framework was embedded, and dyld then stops at launch.
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: $(inherited) @executable_path/../Frameworks
        # The app is UI throughout, so its code is main-actor unless it says
        # otherwise. On this target, not the project: the packages keep nonisolated
        # defaults, as `DocumentTextBuilder` requires, and so would any other target.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        # The two upcoming features the packages enable too, so the app's code is
        # held to the same rules as the code it calls.
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: "YES"
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: "YES"
        SUPPORTS_MACCATALYST: NO
        # "Bundle the RFC index" reads App/Resources, which it declares no input for:
        # the file may be missing, which a declared input may not be.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Icon Composer 27 saves refractivity, which Xcode 26's actool crashes on
        # rather than ignores, so the variant it cannot read is not even an input.
        ASSETCATALOG_COMPILER_APPICON_NAME: $(APP_ICON_$(XCODE_VERSION_MAJOR))
        APP_ICON_2600: AppIcon-26
        APP_ICON_2700: AppIcon-27
        EXCLUDED_SOURCE_FILE_NAMES: AppIcon-*.icon
        INCLUDED_SOURCE_FILE_NAMES: $(ASSETCATALOG_COMPILER_APPICON_NAME).icon

  # The Safari extension that opens an RFC's web page in the app (#194): a web
  # extension in Resources and a native handler that reads a page's URL with
  # RFCKit's `RFCLink`.
  RFCReaderSafari:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/SafariExtension/SafariWebExtensionHandler.swift
      # Safari reads manifest.json from the top of the bundle's resources, so the
      # files are copied one by one, as Xcode's template does, and only images/ as
      # the folder the manifest's paths name.
      - path: App/SafariExtension/Resources
        excludes: ["images/**"]
        buildPhase: resources
      - path: App/SafariExtension/Resources/images
        type: folder
        buildPhase: resources
    dependencies:
      - package: RFCKit
    info:
      path: App/SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: RFC Reader
        # The app's, by alias, which an extension's must match.
        CFBundleShortVersionString: *version
        CFBundleVersion: *build
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: App/SafariExtension/RFCReaderSafari.entitlements
      properties:
        # An extension on macOS runs sandboxed or not at all. It holds no data and
        # makes no connection: Safari grants it the three sites in its manifest.
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.mazetti.rfc-reader.safari
        # The app's upcoming features, for the same reason as there.
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: "YES"
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: "YES"
        SUPPORTS_MACCATALYST: NO

# Declared so XcodeGen writes a shared scheme. Without one, xcodebuild makes a
# scheme for the target on the fly and matches -destination against it before it
# knows the target's platforms, logging "Supported platforms for the buildables in
# the current scheme is empty" on every build.
schemes:
  RFCReader:
    build:
      targets:
        RFCReader: all
