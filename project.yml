# XcodeGen project spec. Run `xcodegen generate` (brew install xcodegen) to produce
# RFCReader.xcodeproj, or create the project by hand as described in docs/GETTING_STARTED.md.
name: RFCReader
options:
  bundleIdPrefix: com.example.rfcreader   # change to your own reverse-DNS prefix
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: YOURTEAMID

packages:
  RFCKit:
    path: Packages/RFCKit
  RFCReaderKit:
    path: Packages/RFCReaderKit

targets:
  RFCReader:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/RFCReader
    dependencies:
      - package: RFCKit
      - package: RFCReaderKit
    info:
      path: App/RFCReader/Info.plist
      properties:
        CFBundleDisplayName: RFC Reader
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.reference
        CFBundleURLTypes:
          - CFBundleURLName: org.rfc-editor.document
            CFBundleURLSchemes: [rfc]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/RFCReader/RFCReader.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rfcreader.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
